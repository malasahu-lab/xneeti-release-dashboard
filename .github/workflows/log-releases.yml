name: Log production releases

on:
  schedule:
    # Every hour at :20 past. GitHub's scheduler is best-effort and can lag by
    # several minutes under load; the script's 48-hour lookback absorbs that.
    - cron: "20 * * * *"
  workflow_dispatch:
    # Gives an on-demand "Run workflow" button in the Actions tab.

# Only one run at a time — two concurrent runs would race on releases.json.
concurrency:
  group: log-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet anthropic pydantic

      - name: Look for new releases
        env:
          XNEETI_TOKEN: ${{ secrets.XNEETI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/log_releases.py

      - name: Commit any new entries
        run: |
          if git diff --quiet -- releases.json; then
            echo "No change to releases.json."
            exit 0
          fi
          git config user.name  "release-logger"
          git config user.email "release-logger@users.noreply.github.com"
          git add releases.json
          git commit -m "chore: log new production release(s)"
          # A deploy can land while this job is running, so rebase rather than
          # fail if main moved underneath us.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
